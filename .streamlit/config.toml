# Streamlit settings for the demo (python run.py demo). Colors match app/theme.py ("asphalt").
[theme]
base = "dark"
primaryColor = "#F5A623"          # Track A: vehicle recalls (signal amber)
backgroundColor = "#15191E"
secondaryBackgroundColor = "#1E242B"
textColor = "#EEF1F4"
borderColor = "#2C343D"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
showWidgetBorder = true

[client]
toolbarMode = "viewer"   # no Deploy button / developer menu while presenting

[browser]
gatherUsageStats = false
